name: ci

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # 集成 PTY 场景需要全局安装 Pi 1.4.0 与 macOS sandbox-exec；默认全 skip，不在 CI 运行。
